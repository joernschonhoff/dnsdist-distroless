stages:
  - build
  - test
  - publish
  - release

# ── build ─────────────────────────────────────────────────────────────────────

.build-template:
  stage: build
  image: docker:29.5@sha256:6b9cd914eb9c6b342c040a49a27a5eb3804453bae6ecc90f7ff96133595a95e8
  services:
    - docker:29.5-dind@sha256:6b9cd914eb9c6b342c040a49a27a5eb3804453bae6ecc90f7ff96133595a95e8
  before_script:
    # Auth to pull private base images referenced in the Dockerfile
    # (pdns-util-quiche, dns-healthcheck) from the same registry host.
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi
    - docker buildx create --use
  script:
    - export DNSDIST_VERSION=$(cat VERSION)
    - |
      docker buildx build \
        --platform "linux/${TARGET_ARCH}" \
        --build-arg DNSDIST_VERSION="${DNSDIST_VERSION}" \
        --label org.opencontainers.image.created=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --label org.opencontainers.image.revision="${CI_COMMIT_SHA}" \
        --cache-from=type=registry,ref="${CI_REGISTRY_IMAGE}:${TARGET_ARCH}-buildcache" \
        --cache-to=type=registry,ref="${CI_REGISTRY_IMAGE}:${TARGET_ARCH}-buildcache",mode=max \
        --tag "${CI_REGISTRY_IMAGE}:${TARGET_ARCH}-${CI_COMMIT_SHA}" \
        --push \
        .

build:amd64:
  extends: .build-template
  tags:
    - saas-linux-small-amd64
  variables:
    TARGET_ARCH: amd64

build:arm64:
  extends: .build-template
  tags:
    - saas-linux-small-arm64
  variables:
    TARGET_ARCH: arm64

# ── test ──────────────────────────────────────────────────────────────────────

.test-template:
  stage: test
  image: docker:29.5@sha256:6b9cd914eb9c6b342c040a49a27a5eb3804453bae6ecc90f7ff96133595a95e8
  services:
    - docker:29.5-dind@sha256:6b9cd914eb9c6b342c040a49a27a5eb3804453bae6ecc90f7ff96133595a95e8
  before_script:
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi
  script:
    - docker pull "${CI_REGISTRY_IMAGE}:${TARGET_ARCH}-${CI_COMMIT_SHA}"
    - docker run --rm --entrypoint /usr/bin/dnsdist "${CI_REGISTRY_IMAGE}:${TARGET_ARCH}-${CI_COMMIT_SHA}" --version
    # TODO :: Write actual tests for dnsdist and not just check the version output

test:amd64:
  extends: .test-template
  needs:
    - build:amd64
  tags:
    - saas-linux-small-amd64
  variables:
    TARGET_ARCH: amd64

test:arm64:
  extends: .test-template
  needs:
    - build:arm64
  tags:
    - saas-linux-small-arm64
  variables:
    TARGET_ARCH: arm64

# ── publish ───────────────────────────────────────────────────────────────────

publish:
  stage: publish
  image: docker:29.5@sha256:6b9cd914eb9c6b342c040a49a27a5eb3804453bae6ecc90f7ff96133595a95e8
  services:
    - docker:29.5-dind@sha256:6b9cd914eb9c6b342c040a49a27a5eb3804453bae6ecc90f7ff96133595a95e8
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - test:amd64
    - test:arm64
  before_script:
    # Check if CI_COMMIT_TAG is equal to the version in the VERSION file to prevent accidental mismatches.
    - |
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ "$TAG_VERSION" != "$(cat VERSION)" ]; then
        echo "Error: CI_COMMIT_TAG ($CI_COMMIT_TAG) does not match VERSION file ($(cat VERSION))"
        exit 1
      fi
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi
  script:
    - export DNSDIST_VERSION=$(cat VERSION)
    - |
      docker buildx imagetools create \
        --tag "${CI_REGISTRY_IMAGE}:${DNSDIST_VERSION}" \
        "${CI_REGISTRY_IMAGE}:amd64-${CI_COMMIT_SHA}" \
        "${CI_REGISTRY_IMAGE}:arm64-${CI_COMMIT_SHA}"

    # Create/update the latest multi-architecture tag.
    - |
      docker buildx imagetools create \
        --tag "${CI_REGISTRY_IMAGE}:latest" \
        "${CI_REGISTRY_IMAGE}:amd64-${CI_COMMIT_SHA}" \
        "${CI_REGISTRY_IMAGE}:arm64-${CI_COMMIT_SHA}"

# ── release ───────────────────────────────────────────────────────────────────

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - publish
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "dnsdist $CI_COMMIT_TAG"
