stages:
  - build
  - test
  - publish
  - release

variables:
  CRANE_VERSION: "0.20.3"
  IMAGE_TAR: image.oci.tar

# ── build ─────────────────────────────────────────────────────────────────────

build:
  stage: build
  image: docker:29.5@sha256:6b9cd914eb9c6b342c040a49a27a5eb3804453bae6ecc90f7ff96133595a95e8
  services:
    - docker:29.5-dind@sha256:6b9cd914eb9c6b342c040a49a27a5eb3804453bae6ecc90f7ff96133595a95e8
  before_script:
    # Auth to pull private base images referenced in the Dockerfile
    # (pdns-util-quiche, dns-healthcheck) from the same registry host.
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi
    - docker buildx create --use
  script:
    - export DNSDIST_VERSION=$(cat VERSION)
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --build-arg DNSDIST_VERSION=${DNSDIST_VERSION} \
        --label org.opencontainers.image.created=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --label org.opencontainers.image.revision=${CI_COMMIT_SHA} \
        --cache-from=type=registry,ref=${CI_REGISTRY_IMAGE}:buildcache \
        --cache-to=type=registry,ref=${CI_REGISTRY_IMAGE}:buildcache,mode=max \
        --output type=oci,dest=${IMAGE_TAR} \
        .
  artifacts:
    paths:
      - ${IMAGE_TAR}
    expire_in: 1 hour

# ── test ──────────────────────────────────────────────────────────────────────

test:
  stage: test
  image: docker:29.5@sha256:6b9cd914eb9c6b342c040a49a27a5eb3804453bae6ecc90f7ff96133595a95e8
  services:
    - docker:29.5-dind@sha256:6b9cd914eb9c6b342c040a49a27a5eb3804453bae6ecc90f7ff96133595a95e8
  before_script:
    # Install crane — single static binary, no extra deps
    - |
      wget -qO- https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz \
        | tar -xz -C /usr/local/bin crane
  script:
    # Load amd64 image into local Docker daemon for smoke testing
    - crane load --platform linux/amd64 ${IMAGE_TAR} dnsdist:test
    - docker run --rm --entrypoint /usr/sbin/dnsdist dnsdist:test --version
    # TODO :: Write actual tests for dnsdist and not just check the version output

# ── publish ───────────────────────────────────────────────────────────────────

publish:
  stage: publish
  image: gcr.io/go-containerregistry/crane:debug@sha256:f01de4f075b6428e11aa4fc03310e4dfc6ff2bd83b61cdcf4a6dac37bf6e7e3a
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    # Check if CI_COMMIT_TAG is equal to the version in the VERSION file to prevent accidental mismatches.
    - |
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [ "$TAG_VERSION" != "$(cat VERSION)" ]; then
        echo "Error: CI_COMMIT_TAG ($CI_COMMIT_TAG) does not match VERSION file ($(cat VERSION))"
        exit 1
      fi
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        crane auth login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi
  script:
    - export DNSDIST_VERSION=$(cat VERSION)
    # Push multi-arch OCI tar — crane preserves the manifest index automatically
    - crane push ${IMAGE_TAR} "${CI_REGISTRY_IMAGE}:${DNSDIST_VERSION}"
    - crane tag "${CI_REGISTRY_IMAGE}:${DNSDIST_VERSION}" latest

# ── release ───────────────────────────────────────────────────────────────────

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - publish
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "dnsdist $CI_COMMIT_TAG"
